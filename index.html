<script>
'use strict';
const icon={bookmark:'<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',share:'<svg viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M5 12v8h14v-8"/></svg>',like:'<svg viewBox="0 0 24 24"><path d="M8 10 12 3c3 0 3 3 2 6h6l-2 11H8zM3 10h5v10H3z"/></svg>'};
const articles=[
{id:'power',cat:'スクープ',tag:'本誌独占',time:'20:45',title:'福井氏と堀氏の確執！　泥沼の権力争い!?　すべては“一脚の椅子”から始まった――本誌が掴んだ「議長席」の全内幕',short:'福井氏と堀氏の確執、発端は“一脚の椅子”!?',summary:'副会長の辞任表明、そして後任内定。鹿山通りを揺るがす人事劇の裏には、議長席と窓際席をめぐる壮絶な駆け引きがあった――と、本誌はみている。',image:'succession.png',caption:'辞任を表明した福井佳亮氏と、後任に内定した堀将二氏（創作ニュース画像）',publisher:'週刊鹿山',paragraphs:[
'鹿山通り商店街協同組合を揺るがす辞任劇。その中心には、一脚の椅子があった――。本誌の取材で、副会長・福井佳亮氏の辞任表明と、堀商事・堀将二氏の後任内定の裏に、「議長席」と「窓際席」をめぐる知られざる駆け引きがあったことがわかった。',
{h:'発端は「座面の2センチ」だった!?'},
'「最初は誰も気にしていなかったんです」。そう声を潜めるのは、ある商店街関係者A氏だ。「でもある朝、議長席の座面が2センチだけ高くなっていた。そこから会議室の空気が変わりました」。誰が、いつ、あのレバーを引いたのか。会議室の防犯カメラは、なぜかその日に限ってエアコンのほうを向いていたという。',
{quote:'「あの椅子に座った者が、鹿山通りを制する」（商店街関係者）'},
{h:'窓際席に眠る「日当たり」の既得権'},
'一方、ノーマークだったのが窓際席だ。冬は暖かく、夏は祭りの山車がよく見える。古参の店主B氏は「窓際こそ真の上座。議長席はおとりにすぎない」と断言する。本誌が独自に入手した会議室の見取り図からは、窓際席から議長の手元資料が丸見えになる位置関係も浮かび上がった。偶然か、それとも――。',
{h:'同じ自販機、同じ缶コーヒー'},
'当の二人を直撃した。福井氏は「この街のために決めなければ」、堀氏は「まだ座ってないのに重責」と、いずれも核心には触れない。だが本誌は見逃さなかった。会議のあと、二人が同じ自販機で、同じ銘柄の缶コーヒーを買っていたことを。これは和解のサインなのか、それとも静かな宣戦布告なのか。',
'次号、本誌はついに「椅子」本人への直撃取材を試みる。'
]},
{id:'angle',cat:'スクープ',tag:'緊急検証',time:'20:40',title:'謝罪の角度「45度」に隠された暗号!?　福井氏が頭を下げた会見、本誌が全コマを緊急検証',short:'謝罪の角度「45度」に隠された暗号!?',summary:'ずらりと並んだ6本のマイク、手つかずの水、そして45度。何気ない会見写真に、本誌は“もう一つの意味”を見つけてしまった。',image:'press-conference.png',caption:'会見で深々と頭を下げる福井佳亮氏（創作会見画像）',publisher:'週刊鹿山',paragraphs:[
'あの日、福井佳亮氏は確かに頭を下げた。問題は、その角度である。本誌が会見写真を拡大し、画面に分度器を当てて導き出した数字は「45度」。謝罪の角度として、あまりにも“きれいすぎる”のだ。',
{h:'なぜ30度でも90度でもなかったのか'},
'謝罪会見に詳しい自称専門家C氏はこう分析する。「30度では軽い。90度では重すぎて、議長席に未練がないように見えてしまう。45度は“辞めるが、椅子のことは忘れていない”という絶妙なメッセージです」。もちろん、福井氏本人がそう語った事実は一切ない。',
{h:'6本のマイクが描く「六角形」'},
'さらに本誌は、机に並んだマイクの本数に注目した。その数、6本。線で結ぶと、いびつながら六角形に見えなくもない。六角形といえば会議室の椅子の脚の……と書きかけたところで、デスクから「さすがに無理がある」と赤字が入った。',
{quote:'「あの水は、飲まないための水だった」（会見に詳しい関係者）'},
{h:'最後まで減らなかったコップの水'},
'見逃せないのが、マイクの横に置かれた一杯の水だ。写真を見る限り、水位はなみなみと保たれている。緊張の場で、なぜ一口も飲まなかったのか。「喉が渇いていなかった」という最も有力な説を、本誌はあえて採用しない。',
'真相は、まだ45度の向こう側にある。'
]},
{id:'hori',cat:'人事',tag:'注目',time:'20:30',title:'後任・堀将二氏「まだ座ってないのに重責」発言の真意　“座らない男”が描く恐るべき新体制とは!?',short:'堀将二氏、“座らない男”の真意',summary:'内定通知を立ったまま読んだ――そんな噂まで飛び交う後任・堀将二氏。椅子をめぐる争いを、椅子に座らないことで制する作戦なのか。',image:'succession.png',thumb:'hori.jpg',caption:'後任に内定した堀商事・堀将二氏（創作ニュース画像）',publisher:'鹿山ニュース',paragraphs:[
'「まだ座ってないのに重責」。後任に内定した堀商事・堀将二氏が漏らしたとされるこの一言が、鹿山通りに波紋を広げている。本誌は、この短い言葉に新体制のすべてが詰まっているとみて、徹底的に読み解いた。',
{h:'内定通知は「立ったまま」読まれた!?'},
'関係者D氏によれば、堀氏は内定の知らせを受けたとき、すすめられた椅子に腰を下ろさなかったという。「座ったら負け、と思っているのかもしれない」（D氏）。椅子をめぐる争いを、椅子に座らないことで超越する――。もしそれが作戦なら、商店街史上もっとも静かなクーデターである。',
{h:'“立ち会議”導入で議長席は消滅するのか'},
'「堀商事の事務所には椅子が一脚もない」という噂まで飛び出したが、本誌が確認したところ、普通に椅子はあった。それでも商店街内部では「新体制は立ち会議になるのでは」との観測が根強い。議長席も窓際席も消えれば、争いの火種そのものがなくなるからだ。',
{quote:'「座らない者に、椅子は奪えない」（商店街のベテラン店主）'},
'写真の堀氏は、どこか遠くを見つめている。その視線の先にあるのは議長席か、窓際か、それとも次の議事録か。新体制の最初の仕事は、どうやら書記決めになりそうだ。'
]},
{id:'chairs',cat:'商店街',tag:'特集',time:'20:20',title:'備品の椅子まで予約殺到!?　“椅子の配置”で委員会が分裂、空席だらけの会議室に未来はあるのか',short:'備品の椅子まで予約殺到!?',summary:'5人辞任・1人内定。空席が増えるほど、なぜか椅子の争奪戦は激しくなる。本誌が鹿山通りの「椅子をめぐる珍事」を総まとめ。',image:'weekly-shikayama.png',thumb:'chair.jpg',caption:'週刊鹿山の中吊り広告に登場した“問題の椅子”（創作画像）',publisher:'週刊鹿山',paragraphs:[
'5人が辞任し、1人が内定。普通に考えれば、会議室の椅子は余るはずだ。ところが鹿山通りでは、空席が増えるほど椅子の争奪戦が激しくなるという、経済学の常識を覆す現象が起きている。',
{h:'備品の椅子、予約表が真っ黒に'},
'関係者によれば、会議室の備品の椅子の予約表が、来月の分までびっしり埋まっているという。予約者の欄には、なぜか同じ筆跡で「会議用」とだけ書かれていた。誰が、何のために。本誌は筆跡鑑定を検討したが、予算の都合で見送った。',
{h:'配置案3つで委員会が分裂'},
{list:['A案：円卓（上座が消える。ただし窓際は残る）','B案：コの字（議長席の権威を守る保守派の本命）','C案：全員窓際（日当たり平等主義。部屋が狭く物理的に不可能）']},
'議論は平行線をたどり、ついには「配置を決める会議の席順」をめぐって新たな対立が生まれた。',
{quote:'「椅子が減れば揉める。椅子が増えても揉める。それが鹿山通り」（商店街関係者）'},
{h:'新たな椅子は現れるのか――本誌が徹底予測'},
'最後に、本誌が次の会議室を占う。本命◎は折りたたみ椅子（片付けが楽）。対抗○はバランスボール（揺れて長い会議に向かない点が、かえって支持を集めている）。大穴▲は立ち会議。空席だらけの会議室に未来はあるのか。答えは、次の会議で誰が最初に座るかにかかっている。'
]},
{id:'line',cat:'商店街',tag:'疑惑',time:'20:15',title:'既読スルーは“合図”だった!?　山下裕二氏の「親指」に隠された暗号、商店街の闇は未読の向こうに',short:'既読スルーは“合図”だった!?',summary:'業務LINEに並ぶ「既読」。返事はない。だが写真の山下氏は満面の笑みで親指を立てている。この親指は、いったい誰への合図だったのか。',image:'four-resignations.png',thumb:'yamashita.jpg',caption:'業務LINEを既読スルーした疑いの山下裕二氏（左下）（創作ニュース画像）',publisher:'商店街通信',paragraphs:[
'返事はない。だが、親指は立っている――。業務LINEを既読スルーした疑いが持たれている山下裕二氏をめぐり、商店街ではある仮説がささやかれ始めた。「あの既読スルーは、意図的な“合図”だったのではないか」。',
{h:'「返信しない」こと自体がメッセージ'},
'関係者が見せてくれた（という設定の）画面には、既読がついたまま止まったメッセージが残されていた。「返信がないこと自体がメッセージなんです」と語るのは、LINEの読み方に一家言ある自称評論家E氏。「沈黙は同意か、拒否か、それとも“まだ椅子を確保中”か。三つの意味を同時に持たせた高度な技です」。',
{h:'親指は「了解」か「いいね」か、それとも'},
'問題の写真で、山下氏は力強く親指を立てている。一般には「了解」や「いいね」の意味だが、本誌は第三の可能性を捨てきれない。それは「椅子、確保しました」のサインである。本人に確認を試みたところ、取材依頼のメッセージにも既読がついた。返事はまだない。',
{quote:'「既読だけで、ここまで揉める。それが鹿山通りの闇」（商店街通信 編集部）'},
'スタンプ一個で歴史は変わったのか。少なくとも、この記事は書かれずに済んだかもしれない。'
]},
{id:'band',cat:'音楽',tag:'独自入手',time:'20:00',title:'業務か音楽か　大山雄祐氏のセットリストに“辞任の暗号”!?　頭文字を縦に読むと浮かび上がる衝撃のメッセージ',short:'セットリストに“辞任の暗号”!?',summary:'業務中のバンド活動が疑われる大山雄祐氏。本誌が入手した（架空の）セットリストを縦に読むと、ある言葉が浮かび上がった。',image:'four-resignations.png',thumb:'oyama.jpg',caption:'業務中にバンド活動した疑いの大山雄祐氏（右上）（創作ニュース画像）',publisher:'鹿山カルチャー',paragraphs:[
'会議は踊る。議事録は止まる。業務中にバンド活動をした疑いが持たれている大山雄祐氏をめぐって、本誌はついに決定的な（と本誌だけが思っている）資料を入手した。とあるライブで演奏されたとされる、6曲のセットリストである。',
{h:'頭文字を縦に読むと……'},
{list:['イカした議事録','ストップ・ザ・会議','ヲタ芸と一本締め','マドギワ・ラプソディ','モア・アンコール','レバーを引くな']},
'お気づきだろうか。各曲の頭文字を縦に読むと「イ・ス・ヲ・マ・モ・レ」――椅子を守れ。偶然と呼ぶには、あまりにもできすぎている。なお、これらの曲が実在するかどうかは確認できていない。というか、たぶん存在しない。',
{h:'会議中のペン回しは「8ビート」だった'},
'さらに複数の出席者が、大山氏の会議中のペン回しについて「妙にリズムがよかった」と証言する。本誌が独自に計測したところ（計測方法は非公開）、テンポはBPM120前後。一本締めの「よーっ、パン」とも、だいたい合う気がするという。',
{quote:'「一本締めで終わるはずの会議が、なぜかアンコールで延長された」（出席者）'},
'次回の会議は定刻に終わるのか、それとも追加公演か。チケットの販売予定は、いまのところない。'
]},
{id:'family',cat:'生活',tag:'注目',time:'19:45',title:'家庭円満がなぜ緊急議題に!?　小宮翔氏“おめでた”の裏で勃発した「拍手の順番」戦争、祝辞をめぐり水面下で激しい攻防',short:'“おめでた”の裏で「拍手戦争」!?',summary:'本来ならただのお祝い。しかし鹿山通りでは、拍手のリズム、花束の色、祝辞の順番までが会議案件になってしまった。',image:'four-resignations.png',thumb:'komiya.jpg',caption:'「奥様を妊娠させた疑い」の小宮翔氏（左上）（創作ニュース画像）',publisher:'商店街通信',paragraphs:[
'「奥様を妊娠させた疑い」――。週刊誌の見出しとしては物騒だが、要するにおめでたい話である。ところが鹿山通りでは、この慶事がなぜか緊急議題に格上げされ、水面下で激しい攻防が始まっているという。',
{h:'三三七拍子派 vs 一本締め派'},
'争点は、お祝いの拍手のやり方だ。古参を中心とする「三三七拍子派」と、効率を重んじる「一本締め派」が真っ向から対立。さらに「拍手はせず心で祝う派」まで現れ、議論は三つどもえの様相を呈している。',
{h:'祝辞の順番をめぐる「椅子取りゲーム」'},
'誰が最初にお祝いを伝えるのか。関係者F氏は「祝辞の順番は、次の会議の席順に直結する」と分析する。つまり、ここでも結局は椅子の話なのだ。花束の色についても、赤（情熱）派と黄色（商店街のテーマカラー）派で意見が割れているという。',
{quote:'「めでたい話ほど、会議は長くなる」（商店街関係者）'},
'写真の小宮氏は、そんな騒動をよそに穏やかな表情で遠くを見つめている。ともあれ本誌からも、心からお祝いを申し上げたい。拍手のやり方は、各自にお任せする。'
]},
{id:'unknown',cat:'人事',tag:'独自',time:'19:30',title:'「ついでに」辞任の衝撃　名称不明の男性こそ“真の黒幕”だった!?　名前より先に辞任が決まった男の正体に迫る',short:'名称不明の男性こそ“真の黒幕”!?',summary:'辞任理由は「ついでに」。名前も役職もわからない。だが本誌は、最も情報が少ない人物こそ、最も多くを知っていると考える。',image:'four-resignations.png',thumb:'unknown.jpg',caption:'「ついでに」辞任した名称不明の男性（右下）（創作ニュース画像）',publisher:'週刊鹿山',paragraphs:[
'辞任理由、「ついでに」。たった4文字で鹿山通りを震撼させた名称不明の男性。名前も役職もわからないまま、辞任だけが先に決まった。だが本誌は、この男こそ一連の辞任ドミノを裏で操る“真の黒幕”なのではないかとみている。',
{h:'「誰も名前を知らない」という最強の武器'},
'考えてみてほしい。名前がわからなければ、問い詰めることもできない。役職がわからなければ、責任を問うこともできない。関係者G氏は震える声で語る。「彼は最初から、名乗らないことで椅子争いの外側に立っていたんです」。',
{h:'Tシャツの文字は暗号か'},
'写真の男性が着ている茶色のTシャツには、英数字のロゴがうっすらと見える。本誌はこれを解読しようと試みたが、画像が粗すぎて断念した。暗号なのか、単なるブランド名なのか。少なくとも本人は、とてもよい笑顔で親指を立てている。',
{quote:'「次の椅子は、誰のものに!?」（週刊鹿山 中吊りより）'},
'本誌はこの男性への接触を試みた。しかし、取材依頼をどこに送ればいいのかわからなかった。名前がわからないからである。'
]},
{id:'weekly',cat:'週刊鹿山',tag:'特集',time:'19:00',title:'【週刊鹿山・秋の増刊号】辞任連鎖の全内幕　5人辞任・1人だけ内定、空席だけが増える緊急事態!?――いったい何があったのか',short:'週刊鹿山 秋の増刊号、本日発売',summary:'確執、45度、座らない男、既読の合図、セットリストの暗号、そして黒幕。鹿山通りの大騒動を一冊に詰め込んだ増刊号の中身を一挙公開。',image:'weekly-shikayama.png',caption:'週刊鹿山・秋の増刊号の中吊り広告（創作画像）',publisher:'週刊鹿山',paragraphs:[
'巨大な赤い見出し、青い帯、ずらりと並ぶモノクロ写真。鹿山通り商店街の身内ジョークを、日本中を揺るがす大スキャンダルのように仕立てた「週刊鹿山・秋の増刊号」の中吊り広告が完成した。',
{h:'今号の主な記事'},
{list:['巻頭スクープ：福井氏と堀氏の確執！ 泥沼の権力争い!?','緊急検証：謝罪の角度まで徹底分析!?','人事：まだ座っていないのに重責!? 後任・堀将二氏','小宮翔氏：家庭円満がなぜ緊急議題に!?','大山雄祐氏：業務か音楽か 商店街まさかのアンコール','山下裕二氏：既読スルーの波紋 スタンプ一個で歴史は変わった!?','名称不明氏：「ついでに」辞任の衝撃','特集：まだまだある 椅子をめぐる珍事の数々']},
'いったい何があったのか――これは、ただの椅子の争いなのか。中吊りの片隅には、そんな問いかけが小さく刷り込まれている。本誌編集部も、正直なところよくわかっていない。',
{quote:'鹿山通り商店街。すべての椅子は、ここから始まった――'},
'画像はタップで拡大できる。縦書きの小見出しまで読み込むと、争っているのが権力なのか、エアコンの当たらない席なのか、だんだんわからなくなってくるはずだ。定価0円。読み終えたら、笑い話の範囲でお楽しみください。'
]}
];
const categories=['トップ','スクープ','人事','商店街','音楽','生活','週刊鹿山'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>articles.find(a=>a.id===id);
function readLocal(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
let saved=new Set(readLocal('shikayama-saved',[]));let liked=new Set(readLocal('shikayama-liked',[]));let comments=readLocal('shikayama-comments',{});
function persist(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch{toast('このブラウザでは保存できません。表示中のみ反映します。');return false}}
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('show'),2600)}
function thumbnail(a){return `<img class="thumb" src="assets/${a.thumb?'thumbs/'+a.thumb:a.image}" alt="${esc(a.caption)}" loading="lazy">`}
function plainText(p){return typeof p==='string'?p:(p.h||p.quote||(p.list||[]).join(' '))}
function row(a){return `<div class="story-row"><a href="#article/${a.id}" tabindex="-1" aria-hidden="true">${thumbnail(a)}</a><div><h3><a href="#article/${a.id}">${esc(a.title)}</a></h3><div class="meta"><span class="publisher">${esc(a.publisher)}</span><span>10/7 ${a.time}</span><span class="tag">${esc(a.cat)}</span>${saved.has(a.id)?'<span>保存済み</span>':''}</div></div></div>`}
function ranking(){return `<section class="panel aside-panel"><h2 class="section-title">本誌が追う疑惑<small>編集部セレクト</small></h2><ol class="ranking">${['power','angle','unknown','line','chairs'].map(id=>`<li><a href="#article/${id}">${esc(byId(id).short)}</a></li>`).join('')}</ol></section>`}
function sidebar(){return `<aside><div class="aside-sticky">${ranking()}<section class="panel aside-panel"><h2 class="section-title">週刊鹿山<small>秋の増刊号</small></h2><img src="assets/weekly-shikayama.png" class="latest-cover" alt="週刊鹿山の中吊り広告。クリックで拡大" loading="lazy" tabindex="0" role="button" data-zoom="weekly-shikayama.png"><p class="cover-caption">「福井氏と堀氏の確執！」<br>辞任連鎖の全内幕を一冊に</p><a class="mini-link" href="#article/weekly">特集記事を読む →</a></section><section class="panel aside-panel"><h2 class="section-title">辞任ドミノ 全記録</h2><ol class="timeline"><li><time>第一幕</time><a href="#article/power">議長席の座面が「2センチ」上がる</a></li><li><time>第二幕</time><a href="#article/angle">福井氏、45度で頭を下げる</a></li><li><time>第三幕</time><a href="#article/hori">堀氏、内定通知を立ったまま読む!?</a></li><li><time>第四幕</time><a href="#article/unknown">4人にも「辞任ドミノ」、黒幕は名称不明!?</a></li><li><time>そして</time><a href="#article/chairs">備品の椅子まで予約殺到</a></li></ol></section><section class="panel aside-panel next-issue"><h2 class="section-title">次号予告<small>週刊鹿山</small></h2><strong>椅子、ついに口を開く!?</strong><p>本誌が「議長席」本人に直撃。10月14日（水）発売予定。※予定は未定です</p></section></div></aside>`}
function home(){const a=byId('power');const list=['angle','hori','line','unknown','band','family','chairs'].map(byId);return `<div class="breaking"><span class="breaking-label">速報</span><a href="#article/hori">堀将二氏、内定通知を“立ったまま”読んでいた!?　本誌が独占入手</a><time>10/7 21:05</time></div><div class="page-grid"><div><section class="panel"><h2 class="section-title">主要ニュース<small>10月7日 特集号</small></h2><article class="hero"><a href="#article/power" class="hero-image"><img src="assets/${a.image}" alt="${esc(a.caption)}" fetchpriority="high"></a><div><div class="eyebrow"><span>${esc(a.tag)}</span>鹿山通り商店街・辞任ドミノ</div><h1><a href="#article/power">福井氏と堀氏の確執！<br>発端は“一脚の椅子”だった!?</a></h1><p class="hero-summary">${esc(a.summary)}</p><div class="meta"><span class="publisher">${esc(a.publisher)}</span><span>10/7 ${a.time}</span></div></div></article>${list.map(row).join('')}<div class="topics"><a href="#search/${encodeURIComponent('福井')}"># 福井佳亮</a><a href="#search/${encodeURIComponent('椅子')}"># 椅子</a><a href="#search/${encodeURIComponent('45度')}"># 45度</a><a href="#search/${encodeURIComponent('既読')}"># 既読スルー</a><a href="#search/${encodeURIComponent('黒幕')}"># 黒幕</a><a href="#search/${encodeURIComponent('ついでに')}"># ついでに</a></div></section><article class="panel feature"><div class="feature-text"><div class="eyebrow">SPECIAL REPORT ／ 週刊鹿山</div><h2>5人辞任・1人だけ内定。<br>空席だけが増える緊急事態!?</h2><p>いったい何があったのか――<br>これは、ただの椅子の争いなのか。</p><a class="feature-cta" href="#article/weekly">特集を読む →</a></div><a href="#article/weekly"><img src="assets/weekly-shikayama.png" alt="週刊鹿山の特集紙面" loading="lazy"></a></article></div>${sidebar()}</div>`}
function block(p,i){if(typeof p==='string')return `<p ${i===0?'class="lead"':''}>${esc(p)}</p>`;if(p.h)return `<h2>${esc(p.h)}</h2>`;if(p.list)return `<ol class="setlist">${p.list.map(li=>`<li>${esc(li)}</li>`).join('')}</ol>`;return `<blockquote class="pullquote">${esc(p.quote)}</blockquote>`}
function articlePage(a){const zoomable=a.image==='weekly-shikayama.png';return `<div class="breadcrumb"><a href="#home">トップ</a><span>›</span><a href="#category/${encodeURIComponent(a.cat)}">${esc(a.cat)}</a><span>›</span><span>記事</span></div><div class="page-grid"><div><article class="panel article-panel"><div class="eyebrow"><span>${esc(a.tag)}</span>${esc(a.cat)}</div><h1>${esc(a.title)}</h1><div class="meta"><span>10/7(水) ${a.time} 配信</span><span class="publisher">${esc(a.publisher)}</span><span class="byline">文／本誌取材班</span></div><div class="article-toolbar"><button class="action ${saved.has(a.id)?'is-active':''}" data-save="${a.id}">${icon.bookmark}<span>${saved.has(a.id)?'保存済み':'記事を保存'}</span></button><button class="action" data-share="${a.id}">${icon.share}リンクをコピー</button><button class="action ${liked.has(a.id)?'is-active':''}" data-like="${a.id}">${icon.like}<span>${liked.has(a.id)?'参考になった':'参考になった？'}</span></button></div><figure class="article-picture"><img src="assets/${a.image}" alt="${esc(a.caption)}" ${zoomable?'tabindex="0" role="button" style="cursor:zoom-in" data-zoom="weekly-shikayama.png"':''}><figcaption>${esc(a.caption)}${zoomable?' ／ 画像をタップして拡大':''}</figcaption></figure><div class="article-body">${a.paragraphs.map(block).join('')}</div><p class="disclaimer">※この記事は身内で楽しむための創作（ジョーク）です。登場する証言・関係者・数字・疑惑はすべてフィクションで、実在の人物の実際の言動とは関係ありません。</p><div class="article-bottom"><span>週刊鹿山・鹿山ニュース編集部</span><a href="#home">ニュース一覧に戻る →</a></div></article><section class="panel comments"><h2>あなたのひとこと</h2><p class="help">投稿はこのブラウザ内に保存されます。ほかの人には公開されません。</p><form id="comment-form" data-article="${a.id}"><textarea id="comment-input" maxlength="500" placeholder="この記事を読んで、ひとこと（500文字まで）" aria-label="コメント" required></textarea><button class="comment-submit" type="submit">ひとことを残す</button></form><div class="comment-list" id="comment-list">${renderComments(a.id)}</div></section><section class="panel"><h2 class="related-title">関連記事</h2>${articles.filter(x=>x.id!==a.id).slice(0,3).map(row).join('')}</section></div>${sidebar()}</div>`}
function renderComments(id){const list=comments[id]||[];return list.length?list.map(c=>`<div class="comment-row"><small>あなた · ${esc(c.date)}</small><p>${esc(c.text)}</p></div>`).join(''):'<p class="muted" style="font-size:12px">まだひとことはありません。</p>'}
function listPage(title,subtitle,list){return `<div class="breadcrumb"><a href="#home">トップ</a><span>›</span>${esc(title)}</div><div class="page-grid"><section class="panel all-list"><h1 class="page-heading">${esc(title)}</h1><p class="page-subtitle">${esc(subtitle)}</p>${list.length?list.map(row).join(''):'<div class="empty">該当する記事はありません。<br><a class="mini-link" href="#home">トップページへ戻る</a></div>'}</section>${sidebar()}</div>`}
function render(){const hash=location.hash.slice(1)||'home';const [route,...parts]=hash.split('/');let arg;try{arg=decodeURIComponent(parts.join('/'))}catch{arg=''}let content;let active='トップ';let title='鹿山通りのいまがわかる';if(route==='article'){const a=byId(arg);content=a?articlePage(a):listPage('記事が見つかりません','URLをご確認ください。',[]);if(a){active=a.cat;title=a.title}}else if(route==='category'){active=arg;title=arg;content=listPage(arg+'ニュース','鹿山通りの気になる話題をまとめてお届け。',articles.filter(a=>a.cat===arg))}else if(route==='search'){title='検索結果';$('#search').value=arg;const q=arg.toLocaleLowerCase();const list=articles.filter(a=>[a.title,a.summary,a.cat,...a.paragraphs.map(plainText)].join(' ').toLocaleLowerCase().includes(q));content=listPage('「'+arg+'」の検索結果',list.length+'件の記事が見つかりました。',list)}else if(route==='saved'){title='保存した記事';content=listPage(title,'気になる記事を、あとからもう一度。',articles.filter(a=>saved.has(a.id)))}else if(route==='about'){title='このサイトについて';content=`<div class="breadcrumb"><a href="#home">トップ</a><span>›</span>${title}</div><section class="panel about-copy"><h1 class="page-heading">SHIKAYAMA!ニュースについて</h1><p>鹿山通りの身内ジョークを、ニュースポータルと週刊誌の形で楽しむサイトです。記事・関係者の証言・数字・会見画像はすべて創作です。実際の報道や事実確認を行うニュースメディアではありません。</p><p>Yahoo!ニュースを参考にしたオリジナルのデザインで、Yahoo! JAPANの公式サイトではありません。</p><h2>このサイトでできること</h2><p>記事の閲覧・検索・カテゴリの切り替え、記事の保存、リンクのコピー、紙面画像の拡大ができます。保存した記事と「あなたのひとこと」は、ご利用中のブラウザ内に保存されます。</p><p>人物の名前はご提供いただいた指定に基づいています。生成画像の文字に誤りがある場合も、記事本文では指定された表記を用いています。</p><a class="mini-link" href="#home">トップページへ戻る →</a></section>`}else{content=home()}$('#main').innerHTML=content;$('#nav').innerHTML=categories.map(c=>`<a href="${c==='トップ'?'#home':'#category/'+encodeURIComponent(c)}" class="${c===active?'active':''}" ${c===active?'aria-current="page"':''}>${c}</a>`).join('');document.title=title+'｜SHIKAYAMA!ニュース';if(route!=='search')$('#search').value='';window.scrollTo({top:0,behavior:'instant'});}
document.addEventListener('click',async e=>{const save=e.target.closest('[data-save]');const like=e.target.closest('[data-like]');const share=e.target.closest('[data-share]');const zoom=e.target.closest('[data-zoom]');if(save){const id=save.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);const ok=persist('shikayama-saved',[...saved]);save.classList.toggle('is-active',saved.has(id));save.querySelector('span').textContent=saved.has(id)?'保存済み':'記事を保存';if(ok)toast(saved.has(id)?'記事を保存しました':'保存を解除しました')}if(like){const id=like.dataset.like;liked.has(id)?liked.delete(id):liked.add(id);persist('shikayama-liked',[...liked]);like.classList.toggle('is-active',liked.has(id));like.querySelector('span').textContent=liked.has(id)?'参考になった':'参考になった？'}if(share){const url=location.href.split('#')[0]+'#article/'+share.dataset.share;try{await navigator.clipboard.writeText(url);toast('記事のリンクをコピーしました')}catch{window.prompt('記事のリンクをコピーしてください',url)}}if(zoom){$('#lightbox-image').src='assets/'+zoom.dataset.zoom;$('#lightbox').showModal()}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-zoom]')){e.preventDefault();e.target.click()}});
document.addEventListener('submit',e=>{if(e.target.id==='comment-form'){e.preventDefault();const text=$('#comment-input').value.trim();if(!text)return;const id=e.target.dataset.article;const date=new Date().toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});(comments[id]||=[]).unshift({text,date});const ok=persist('shikayama-comments',comments);$('#comment-list').innerHTML=renderComments(id);$('#comment-input').value='';if(ok)toast('ひとことをこのブラウザに保存しました')}});
$('#search-form').addEventListener('submit',e=>{e.preventDefault();const q=$('#search').value.trim();if(q){const next='#search/'+encodeURIComponent(q);if(location.hash===next)render();else location.hash=next}});
$('#saved-button').addEventListener('click',()=>{location.hash='saved'});$('#close-lightbox').addEventListener('click',()=>$('#lightbox').close());$('#lightbox').addEventListener('click',e=>{if(e.target===$('#lightbox'))$('#lightbox').close()});window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
